<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guevara WiFi - Captive Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            color: #fff; 
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .subtitle { color: #c8d6e5; font-size: 1.2rem; margin-bottom: 2rem; }
        
        .plan-card { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); 
            border-radius: 16px; 
            padding: 2rem; 
            margin-bottom: 1.5rem; 
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .plan-card:hover { border-color: #fff; transform: translateY(-4px); }
        .plan-name { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .plan-price { color: #e0e7ff; font-size: 1.2rem; margin-bottom: 1rem; }
        .plan-features { list-style: none; padding: 0; }
        .plan-features li { 
            color: #98a2b3; 
            font-size: 0.9rem; 
            margin: 0.5rem 0; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .plan-features li::before { content: "✓"; color: #48dbfb; font-size: 0.8rem; }
        
        .connect-btn { 
            width: 100%; 
            padding: 1rem; 
            background: #fff; 
            color: #667eea; 
            border: none; 
            border-radius: 12px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .connect-btn:hover { background: #fff; }
        .connect-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .phone-input { 
            width: 100%; 
            padding: 0.8rem 1rem; 
            background: rgba(255,255,255,0.2); 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 12px; 
            color: #fff; 
            font-size: 1rem; 
            margin: 0.5rem 0 1rem 0;
            transition: border-color 0.2s;
        }
        .phone-input:focus { outline: none; border-color: #c8d6e5; }
        
        .status { padding: 1rem; border-radius: 12px; margin: 1rem 0; font-size: 0.9rem; }
        .status.success { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; border: 1px solid #48dbfb; }
        .status.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #fc8181; }
        .status.pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #fcd34d; }
        
        .footer { margin-top: 2rem; text-align: center; color: #98a2b3; font-size: 0.8rem; }
        .footer a { color: #a7f3d0; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guevara WiFi</h1>
        <p class="subtitle">Pay with M-Pesa & Get Online Instantly</p>
        
        <div class="plans-grid">
            <!-- Plans will be rendered by JS -->
        </div>
        
        <div id="connectSection">
            <h3>Connect with Phone Number</h3>
            <input type="tel" id="phoneInput" class="phone-input" placeholder="e.g., 0712345678" autocomplete="off">
            <button class="connect-btn" id="connectBtn">Connect & Pay with M-Pesa</button>
            <p id="statusDisplay" class="status pending">Enter your phone number to begin</p>
        </div>
        
        <div id="successSection" style="display: none; margin-top: 2rem;">
            <div class="status success">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-right: 0.5rem; vertical-align: middle;">
                    <path d="M20 6L9 17l-5-5"/>
                </svg>
                <span>Connected Successfully!</span>
                <p>Your <strong>${planName}</strong> plan is now active.</p>
                <p>Enjoy unlimited internet on Guevara WiFi network.</p>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Guevara Limited | <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
        </footer>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
        
        const supabase = createClient(
            'https://kbdsoorrgyzlfctrudfs.supabase.co',
            'sb_publishable_z9oJBmXczAjb_Qncl5uN9w_pzTUnys6'
        );
        
        // Plan data
        const plans = [
            { id: 'hourly', name: 'Hourly Boost', price: 20, data: '1 hour', features: ['Unlimited data for 1 hour'] },
            { id: 'daily-2gb', name: 'Daily 2GB', price: 50, data: '2GB', features: ['2GB data for 24 hours'] },
            { id: 'daily-unlimited', name: 'Daily Unlimited', price: 100, data: 'Unlimited', features: ['Unlimited data for 24 hours'] },
            { id: 'weekly', name: 'Weekly Unlimited', price: 500, data: '7 days', features: ['Unlimited data for 7 days'] },
            { id: 'monthly', name: 'Monthly Home', price: 1500, data: '30 days', features: ['Unlimited data for 30 days, 5 devices'] }
        ];
        
        let selectedPlan = null;
        
        // Render plans
        const plansGrid = document.createElement('div');
        plansGrid.style.display = 'grid';
        plansGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(250px, 1fr))';
        plansGrid.style.gap: '1.5rem';
        plansGrid.style.marginBottom: '2rem';
        
        plans.forEach(plan => {
            const card = document.createElement('div');
            card.className = 'plan-card';
            card.innerHTML = `
                <div class="plan-name">${plan.name}</div>
                <div class="plan-price">KSh ${plan.price}</div>
                <ul class="plan-features">
                    ${plan.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <button class="connect-btn" data-plan-id="${plan.id}">Connect & Pay</button>
            `;
            card.querySelector(`[data-plan-id="${plan.id}"]`).addEventListener('click', () => selectPlan(plan));
            plansGrid.appendChild(card);
        });
        
        // Replace the plans grid
        const gridElement = document.querySelector('.plans-grid');
        if (gridElement) gridElement.replaceWith(plansGrid);
        
        // Select plan function
        async function selectPlan(plan) {
            selectedPlan = plan;
            
            // Update connect section
            const connectSection = document.getElementById('connectSection');
            const statusDisplay = document.getElementById('statusDisplay');
            const connectBtn = document.getElementById('connectBtn');
            
            connectSection.style.display = 'block';
            statusDisplay.textContent = `Selected: ${plan.name} - KSh ${plan.price}`;
            connectBtn.onclick = initiateConnection;
            
            // Hide success section
            document.getElementById('successSection').style.display = 'none';
        }
        
        async function initiateConnection() {
            const phoneInput = document.getElementById('phoneInput');
            const phone = phoneInput.value.trim();
            
            if (!phone || !selectedPlan) {
                showStatus('Please enter a valid phone number and select a plan', 'error');
                return;
            }
            
            // Validate phone number (Kenyan format)
            const cleanedPhone = phone.replace(/[\s-]/g, '');
            if (!/^(07|2547)\d{8}$/.test(cleanedPhone)) {
                showStatus('Please enter a valid Safaricom number starting with 07', 'error');
                phoneInput.focus();
                return;
            }
            
            // Show pending status
            showStatus('Processing your connection...', 'pending');
            
            try {
                // Sign in or create anonymous session with guest data
                const { data, error } = await supabase.auth.signInWithOtp({
                    email: `guest_${Date.now()}@guevara.wifi`,
                    options: {
                        data: {
                            phone: cleanedPhone,
                            plan_id: selectedPlan.id,
                            plan_name: selectedPlan.name,
                            plan_price: selectedPlan.price
                        }
                    }
                });
                
                if (error) throw error;
                
                // Insert billing record
                const { error: billingError } = await supabase
                    .from('users_billing')
                    .insert([{
                        user_id: data.user.id,
                        amount_paid: selectedPlan.price,
                        status: 'pending',
                        payment_date: new Date().toISOString(),
                        plan_id: selectedPlan.id
                    }];
                
                if (billingError) throw billingError;
                
                // Show pending status and start polling
                showStatus('M-Pesa STK push sent to your phone. Enter PIN to complete.', 'pending');
                
                // Poll for payment status
                pollPaymentStatus(data.user.id);
                
            } catch (error) {
                console.error(error);
                showStatus('Error: ' + error.message, 'error');
            }
            
            phoneInput.value = '';
        }
        
        function pollPaymentStatus(userId) {
            const statusDisplay = document.getElementById('statusDisplay');
            let pollCount = 0;
            const maxPolls = 30; // 30 seconds
            
            const interval = setInterval(async () => {
                pollCount++;
                if (pollCount > maxPolls) {
                    clearInterval(interval);
                    showStatus('Payment timed out. Please try again or contact support.', 'error');
                    return;
                }
                
                const { data, error } = await supabase
                    .from('users_billing')
                    .select('status, paid_at')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (error) {
                    console.error('Poll error:', error);
                    return;
                }
                
                if (data && data.length > 0) {
                    const billing = data[0];
                    if (billing.status === 'paid') {
                        clearInterval(interval);
                        showStatus(`<strong>Connected!</strong> Payment received at ${new Date(billing.paid_at).toLocaleTimeString()}. Enjoy your ${selectedPlan.name} plan.`, 'success');
                    } else if (billing.status === 'failed') {
                        clearInterval(interval);
                        showStatus('Payment failed. Please try again or contact support.', 'error');
                    }
                    // If still pending, continue polling
                }
            }, 1000); // Check every second
        }
        
        function showStatus(message, type) {
            const statusDisplay = document.getElementById('statusDisplay');
            const connectBtn = document.getElementById('connectBtn');
            const statusClass = ['pending', 'success', 'error'][type] || 'pending';
            
            statusDisplay.className = `status ${statusClass}`;
            statusDisplay.textContent = message;
            
            if (type === 'success') {
                // Show success section and hide connect section
                document.getElementById('successSection').style.display = 'block';
                document.getElementById('connectSection').style.display = 'none';
                
                // Get the plan name for the success message
                const successSection = document.getElementById('successSection');
                successSection.querySelector('strong').textContent = selectedPlan ? selectedPlan.name : 'your plan';
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            if (container) container.insertBefore(plansGrid, document.querySelector('#connectSection') || container.firstChild);
        });
    </script>
</body>
</html>
